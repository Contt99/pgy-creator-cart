<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>达人购物车</title>
  <link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="../shared/review-ui.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div>
        <h1>达人购物车</h1>
        <p>按小红书号去重并保存在本机</p>
      </div>
      <span class="total-count" data-total-count>0</span>
    </header>

    <section class="project-section" aria-labelledby="project-label">
      <div class="section-label" id="project-label">当前项目</div>
      <div class="project-switch-row">
        <select data-project-select aria-label="切换项目"></select>
        <button type="button" class="button button-danger" data-delete-project>删除</button>
      </div>
      <form class="project-create-row" data-project-form>
        <input type="text" maxlength="30" placeholder="新项目名称" aria-label="新项目名称" data-project-name>
        <button type="submit" class="button">新建项目</button>
      </form>
    </section>

    <section class="cart-section" aria-labelledby="cart-list-label">
      <div class="cart-toolbar">
        <span id="cart-list-label" data-project-summary>0 位达人</span>
        <button type="button" class="link-button" data-select-all>全选</button>
        <button type="button" class="link-button" data-clear-selection>取消选择</button>
      </div>
      <div class="creator-list" data-creator-list></div>
    </section>

    <footer class="popup-footer">
      <div class="status" role="status" aria-live="polite"><span data-status>列表已自动保存</span><button type="button" class="link-button" data-undo-remove hidden>撤销</button></div>
      <div class="backup-actions"><button type="button" class="link-button" data-backup>备份数据</button><button type="button" class="link-button" data-restore-backup>恢复备份</button><input type="file" accept="application/json,.json" data-backup-file aria-label="选择蒲公英达人购物车备份文件" hidden></div>
      <div class="footer-actions">
        <button type="button" class="button" data-clear-cart>清空当前项目</button>
        <button type="button" class="button button-primary" data-export disabled>下载 Excel</button>
      </div>
    </footer>
  </main>
  <script src="../shared/storage.js"></script>
  <script src="../shared/xlsx.js"></script>
  <script src="../shared/review-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
